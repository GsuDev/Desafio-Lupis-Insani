upstream frontend_upstream {
    server frontend:80;
}

upstream php_backend {
    server laravel:9000;
}

upstream reverb_upstream {
    server reverb:8080;
}

server {
    listen 80;
    server_name _;
    
    client_max_body_size 100M;
    
    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # ======================
    # BACKEND API (Laravel via PHP-FPM)
    # ======================
    location /api {
        # Rate limiting (opcional, descomenta si quieres)
        # limit_req zone=api_limit burst=20 nodelay;
        
        # Reescribir /api a / para Laravel
        rewrite ^/api/(.*)$ /$1 break;
        
        # PHP-FPM via FastCGI
        fastcgi_pass php_backend;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        
        # Headers
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_REAL_IP $remote_addr;
        fastcgi_param HTTP_HOST $host;
        
        # Timeouts
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    # ======================
    # REVERB WEBSOCKETS
    # ======================
    location /app {
        proxy_pass http://reverb_upstream;
        proxy_http_version 1.1;
        
        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts largos para WebSockets
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        
        # Headers estándar
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ======================
    # FRONTEND ESTÁTICOS (desde contenedor frontend)
    # ======================
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Cache de estáticos
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ======================
# Rate Limiting Zone (opcional)
# ======================
# Descomenta si quieres rate limiting en /api
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;