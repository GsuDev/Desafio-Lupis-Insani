services:
  # -----------------------------
  # Laravel API (PHP-FPM)
  # -----------------------------
  laravel:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: laravel-app-prod
    restart: unless-stopped
    volumes:
      - ./backend/.env:/var/www/html/.env
      - storage_data:/var/www/html/storage
    depends_on:
      - mariadb
      - redis
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=laravel
      - DB_USERNAME=laravel
      - DB_PASSWORD=secret
      - QUEUE_CONNECTION=redis
      - BROADCAST_DRIVER=reverb
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
    networks:
      - backend
      - frontend
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  # -----------------------------
  # Laravel Reverb (WebSockets)
  # -----------------------------
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: laravel-reverb-prod
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend/.env:/var/www/html/.env
    depends_on:
      - laravel
      - redis
    environment:
      - QUEUE_CONNECTION=redis
      - BROADCAST_DRIVER=reverb
      - REVERB_PORT=8080
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=laravel
      - DB_USERNAME=laravel
      - DB_PASSWORD=secret
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    networks:
      - backend
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 30s
      timeout: 10s
      retries: 3

  # -----------------------------
  # Worker (Jobs, Game Engine)
  # -----------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: laravel-worker-prod
    restart: unless-stopped
    depends_on:
      - laravel
      - reverb
      - redis
    working_dir: /var/www/html
    volumes:
      - ./backend/.env:/var/www/html/.env
      - storage_data:/var/www/html/storage
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_DATABASE=laravel
      - DB_USERNAME=laravel
      - DB_PASSWORD=secret
      - QUEUE_CONNECTION=redis
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600 --verbose
    networks:
      - backend

  # -----------------------------
  # Redis (colas y Reverb)
  # -----------------------------
  redis:
    image: redis:alpine
    container_name: redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # -----------------------------
  # MariaDB
  # -----------------------------
  mariadb:
    image: mariadb:11
    container_name: mariadb-prod
    restart: unless-stopped
    environment:
      - MARIADB_ROOT_PASSWORD=root
      - MARIADB_DATABASE=laravel
      - MARIADB_USER=laravel
      - MARIADB_PASSWORD=secret
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 3

  # -----------------------------
  # Frontend (Nginx sirviendo estáticos)
  # -----------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=http://localhost/api
        - VITE_WS_URL=ws://localhost/app
    container_name: frontend-prod
    restart: unless-stopped
    networks:
      - frontend

  # -----------------------------
  # Nginx Proxy + Estáticos
  # -----------------------------
  nginx:
    image: nginx:alpine
    container_name: nginx-proxy-prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - laravel
      - frontend
      - reverb
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mariadb_data:
  redis_data:
  storage_data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge